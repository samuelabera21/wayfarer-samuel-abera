services:
  postgres:
    image: postgres:16-alpine
    container_name: wayfarer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wayfarer_db
    ports:
      - "5432:5432"
    volumes:
      - wayfarer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wayfarer_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  wayfarer_pgdata:

